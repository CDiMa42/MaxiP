<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MaxiP — MaxiParoliere</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="game.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <main>
        <header>
            <h1>MaxiP <small>MaxiParoliere</small></h1>
            <p id="status" role="status" aria-live="polite">Premi Mescola per iniziare.</p>
        </header>
        <div class="board" id="board" role="group" aria-label="Tabellone di 25 dadi"></div>
        <section class="timer" aria-label="Tempo di gioco">
            <span>Tempo restante</span> <strong id="time" role="timer">3:00</strong>
            <progress id="progress" max="180000" value="0" aria-label="Tempo trascorso"></progress>
        </section>
        <nav aria-label="Comandi di gioco">
            <button id="shuffle" type="button">Mescola</button>
            <button id="pause" type="button" disabled>Pausa</button>
            <button id="fullscreen" type="button">Schermo intero</button>
        </nav>
        <footer>Telecomando: frecce e OK · Tastiera: Tab e Invio · Partite da 3 minuti</footer>
        <p id="notice" role="status" aria-live="polite"></p>
        <noscript>Per giocare è necessario abilitare JavaScript nel browser.</noscript>
    </main>
</body>
</html>
